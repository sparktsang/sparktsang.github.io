<html>

{% include head.html %}

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">
        <div class="inner">
            <header class="major">
                <h1>{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ site.description }}</p>
            </div>
        </div>
    </section>

    <!-- Main -->
    <div id="main">

        <!-- One -->
        {% include tiles.html %}

        <!-- Two -->
        <section id="two">
            <div class="inner">
                <!-- <header class="major">
                    <h2>My never ending ambition</h2>
                </header> -->
                <p>{{ content }}</p>
            </div>
        </section>

    </div>
    {% include footer.html %}

	<script>
	document.addEventListener('DOMContentLoaded', () => {
	
	  // 1. 偵測係咪觸控設備
	  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
	
	  // 2. 如果係觸控設備，就啟用以下邏輯
	  if (isTouchDevice) {
	    const allTiles = document.querySelectorAll('.tiles article');
	
	    allTiles.forEach(tile => {
	      tile.addEventListener('click', (event) => {
	        // 檢查呢塊磚係咪已經係「hover」狀態
	        const isAlreadyHovered = tile.classList.contains('is-hovered');
	
	        if (isAlreadyHovered) {
	          // 如果係，代表係第二次撳，就乜都唔做，由佢自然跳轉去連結
	          return;
	        } else {
	          // 如果唔係，代表係第一次撳
	          
	          // a. 最關鍵一步：阻止連結即刻跳轉
	          event.preventDefault();
	
	          // b. 將其他已經係「hover」狀態嘅磚塊變返原狀
	          allTiles.forEach(otherTile => {
	            otherTile.classList.remove('is-hovered');
	          });
	
	          // c. 將依家撳緊呢塊磚，設定為「hover」狀態
	          tile.classList.add('is-hovered');
	        }
	      });
	    });
	
	    // 3. 監聽頁面其他地方嘅點擊，用嚟取消所有磚塊嘅「hover」狀態
	    document.addEventListener('click', (event) => {
	      // 如果撳嘅地方唔係一塊磚，或者唔係磚入面嘅嘢
	      if (!event.target.closest('.tiles article')) {
	        allTiles.forEach(tile => {
	          tile.classList.remove('is-hovered');
	        });
	      }
	    });
	  }
	});
	</script>
	
</body>

</html>
