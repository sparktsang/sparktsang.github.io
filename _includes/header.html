<!-- Wrapper -->
<div id="wrapper">

<!-- Header -->
<header id="header"class="alt">
	<a href="{{ "" | absolute_url }}" class="logo"><strong>{{ site.title }}</strong> <span>{{ site.subtitle }}</span></a>
	<nav>
		<a href="#menu" aria-label="Menu"></a>
	</nav>
</header>

<!-- Menu -->
<nav id="menu">
	<ul class="links">
		{% for page in site.data.site_navigation.home_pages %}
			<li><a href="{{ "" | absolute_url }}">{{ page.title }}</a></li>
		{% endfor %}
		{% for page in site.data.site_navigation.menu_pages %}
			<li><a href="{% if page.redirect_to %}{{ page.redirect_to }}{% else %}{{ page.url | absolute_url }}{% endif %}">{{ page.menu_title | default: page.title }}</a></li>
		{% endfor %}
	</ul>
</nav>
